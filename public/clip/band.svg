<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Persona wristband">
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="0.5" stop-color="#48484a"/>
      <stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f7"/>
      <stop offset="1" stop-color="#c7c7cc"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="none"/>
  <!-- band -->
  <path d="M60 180 C60 90 180 60 320 60 C460 60 580 90 580 180 C580 270 460 300 320 300 C180 300 60 270 60 180 Z" fill="none" stroke="url(#strap)" stroke-width="44" stroke-linecap="round"/>
  <path d="M60 180 C60 90 180 60 320 60 C460 60 580 90 580 180 C580 270 460 300 320 300 C180 300 60 270 60 180 Z" fill="none" stroke="#1c1c1e" stroke-width="2" opacity="0.5"/>
  <!-- stitch line -->
  <path d="M80 180 C80 104 190 78 320 78 C450 78 560 104 560 180 C560 256 450 282 320 282 C190 282 80 256 80 180 Z" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6"/>
  <!-- sensor module -->
  <rect x="250" y="34" width="140" height="56" rx="20" fill="url(#module)" stroke="#a1a1a6" stroke-width="2"/>
  <circle cx="320" cy="62" r="9" fill="#1982fc"/>
  <circle cx="320" cy="62" r="17" fill="none" stroke="#1982fc" stroke-width="2" opacity="0.35"/>
  <circle cx="320" cy="62" r="25" fill="none" stroke="#1982fc" stroke-width="1.5" opacity="0.18"/>
  <text x="320" y="340" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8e8e93">Persona Band · haptics, mic, all-day battery</text>
</svg>
